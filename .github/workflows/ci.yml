name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token, no secrets: a pull request from a fork never sees any.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Converter engine is built first: the Scraper tests import converter/core/dist.
      - run: npm --prefix converter ci
      - run: npm --prefix converter test
      - run: npm ci
      - run: npm test
