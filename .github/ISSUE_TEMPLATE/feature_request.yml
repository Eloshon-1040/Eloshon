name: Idea / improvement
description: Suggest a feature or a new format
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: The need
      description: What problem are you trying to solve? Who has it (shop owner, agency, developer…)?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea for a solution (optional)
  - type: checkboxes
    id: ok
    attributes:
      label: Reminder
      options:
        - label: I did not attach any key or personal data.
          required: true
