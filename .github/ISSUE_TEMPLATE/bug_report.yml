name: Bug / Erreur
description: Quelque chose ne marche pas comme prévu
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        N'ajoutez **aucune clé, aucun mot de passe, aucune donnée personnelle ni catalogue client**. Une faille de sécurité ne se signale pas ici : voir SECURITY.md.
  - type: dropdown
    id: app
    attributes:
      label: Application
      options: [Eloshon Scraper, Eloshon Converter, Extension Chrome/Edge]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (affichée en bas à gauche de l'application)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Format de départ, format cible, étape de l'assistant, boutons cliqués.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu et résultat obtenu
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Exemple minimal (facultatif)
      description: Quelques lignes **anonymisées** du fichier, ou l'adresse publique de la page concernée.
  - type: input
    id: os
    attributes:
      label: Système (ex. Windows 11)
