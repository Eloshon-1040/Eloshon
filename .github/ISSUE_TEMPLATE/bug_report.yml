name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please **do not include keys, passwords, personal data or a real customer catalog**. A few anonymised rows are enough.
        A security problem must not be reported here: see SECURITY.md.
  - type: dropdown
    id: app
    attributes:
      label: Application
      options: [Eloshon Converter, Eloshon Scraper, Browser extension]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (shown at the bottom left of the app)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Source format, target format, the wizard step, what you clicked.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and actual result
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal example (optional)
      description: A few **anonymised** rows of the file, or the public address of the page concerned.
  - type: input
    id: os
    attributes:
      label: System (e.g. Windows 11)
